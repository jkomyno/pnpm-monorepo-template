name: '  📦 Release'

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm trusted publishing (OIDC)

env:
  CI: 'true'

jobs:
  release:
    # Disabled by default in this template.
    # To enable: set up npm trusted publishing (OIDC), remove this guard,
    # and uncomment the Changesets step below.
    if: false
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: '🧰 Setup (mise)'
        uses: ./.github/actions/setup-mise

      # - name: "📦 Create Release PR or Publish"
      #   id: changesets
      #   uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
